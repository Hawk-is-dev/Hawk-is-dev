<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">HAWK's GitHub Stats</title>
  <desc id="desc">Custom midnight-themed GitHub statistics banner with handwritten-style typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b1b"/><stop offset=".55" stop-color="#15112b"/><stop offset="1" stop-color="#252052"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <clipPath id="avatar"><circle cx="710" cy="145" r="76"/></clipPath>
  </defs>
  <rect width="900" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="297" rx="21" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="3"/>
  <circle cx="805" cy="45" r="2" fill="#f5d0fe"/><circle cx="770" cy="76" r="3" fill="#c4b5fd"/>
  <path d="M620 35 Q720 -8 835 45 Q875 65 852 110" fill="none" stroke="#c4b5fd" stroke-opacity=".45" stroke-width="2"/>
  <path d="M610 258 Q735 220 875 270" fill="none" stroke="#f0abfc" stroke-opacity=".3" stroke-width="2"/>
  <text x="48" y="55" fill="#c4b5fd" font-family="cursive" font-size="19">✦  MIDNIGHT PROFILE  ✦</text>
  <text x="43" y="126" fill="url(#accent)" font-family="'Brush Script MT','Segoe Script',cursive" font-style="italic" font-size="53">HAWK's GitHub Stats</text>
  <path d="M49 145 Q200 160 470 143" fill="none" stroke="#e879f9" stroke-width="3" stroke-linecap="round"/>
  <g fill="#e2e8f0" font-family="Georgia,serif" font-size="19">
    <text x="52" y="190">✧  Code • Create • Repeat</text>
    <text x="52" y="224">☾  Quiet mind, midnight energy</text>
  </g>
  <g clip-path="url(#avatar)">
    <image href="https://github.com/Hawk-is-dev.png" x="634" y="69" width="152" height="152" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="710" cy="145" r="79" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <text x="710" y="253" fill="#f5d0fe" font-family="cursive" font-size="24" text-anchor="middle">✧ H A W K ✧</text>
  <text x="852" y="282" fill="#94a3b8" font-family="Georgia,serif" font-size="12" text-anchor="end">github.com/Hawk-is-dev</text>
</svg>